<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Hero for jqu224/infographic-slides — skeuomorphic "infographic drafting mat".
    Persona-dash discipline: print grid + ruler ticks + diagonal construction lines
    + 800-weight wordmark + double-framed BY nameplate.
    HCT tone derivation — repo personality: verdant report board (forest green 148)
    with amber 85 as the counter hue. Tone 87/67/17:
      green  T87 #A8D3BC   T67 #55AE83   T17 #123A2B
      amber  T87 #F4DBAE   T67 #D9A24E   T17 #46310C
  -->
  <defs>
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFF5F0"/>
      <stop offset="1" stop-color="#DFEBE2"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55AE83"/>
      <stop offset="0.55" stop-color="#97B868"/>
      <stop offset="1" stop-color="#D9A24E"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#123A2B" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="gridFine" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M6 0H0V6" fill="none" stroke="#123A2B" stroke-opacity="0.035" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- mat -->
  <rect x="0" y="0" width="1200" height="420" rx="22" fill="url(#mat)"/>
  <rect x="0" y="0" width="1200" height="420" rx="22" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="420" rx="22" fill="url(#gridFine)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="21.5" fill="none" stroke="#123A2B" stroke-opacity="0.28" stroke-width="1"/>

  <!-- rulers: top + left, ticks every 12, tall every 60 -->
  <g stroke="#123A2B" stroke-opacity="0.4">
    <g>
      <line x1="26" y1="12" x2="1174" y2="12" stroke-opacity="0.25"/>
      <path d="M38 8v8 M62 10v4 M86 8v8 M110 10v4 M134 8v8 M158 10v4 M182 8v8 M206 10v4 M230 8v8 M254 10v4 M278 8v8 M302 10v4 M326 8v8 M350 10v4 M374 8v8 M398 10v4 M422 8v8 M446 10v4 M470 8v8 M494 10v4 M518 8v8 M542 10v4 M566 8v8 M590 10v4 M614 8v8 M638 10v4 M662 8v8 M686 10v4 M710 8v8 M734 10v4 M758 8v8 M782 10v4 M806 8v8 M830 10v4 M854 8v8 M878 10v4 M902 8v8 M926 10v4 M950 8v8 M974 10v4 M998 8v8 M1022 10v4 M1046 8v8 M1070 10v4 M1094 8v8 M1118 10v4 M1142 8v8 M1166 10v4" fill="none"/>
    </g>
    <g>
      <line x1="12" y1="26" x2="12" y2="394" stroke-opacity="0.25"/>
      <path d="M8 38h8 M10 62h4 M8 86h8 M10 110h4 M8 134h8 M10 158h4 M8 182h8 M10 206h4 M8 230h8 M10 254h4 M8 278h8 M10 302h4 M8 326h8 M10 350h4 M8 374h8" fill="none"/>
    </g>
  </g>

  <!-- diagonal construction lines -->
  <g stroke="#123A2B" stroke-dasharray="7 7">
    <line x1="26" y1="26" x2="1174" y2="394" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="26" y1="394" x2="1174" y2="26" stroke-opacity="0.08" stroke-width="1"/>
  </g>
  <!-- registration circles -->
  <g fill="none" stroke="#123A2B" stroke-opacity="0.3">
    <circle cx="1174" cy="26" r="5"/><circle cx="1174" cy="26" r="1.6" fill="#123A2B" stroke="none"/>
    <circle cx="26" cy="394" r="5"/><circle cx="26" cy="394" r="1.6" fill="#123A2B" stroke="none"/>
  </g>

  <!-- ============ left: wordmark block (lifted 10% of canvas height) ============ -->
  <g transform="translate(0 -42)">
    <text x="64" y="106" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="6" fill="#123A2B" fill-opacity="0.62">SKILL · SVG INFOGRAPHICS FOR AI AGENTS</text>
    <text x="60" y="196" font-size="88" font-weight="800" letter-spacing="2" fill="#123A2B">INFOGRAPHIC</text>
    <text x="60" y="286" font-size="88" font-weight="800" letter-spacing="2">
      <tspan fill="#55AE83">SLIDES</tspan><tspan fill="#D9A24E" font-size="44" dy="-40"> 16×9</tspan>
    </text>
    <rect x="64" y="316" width="560" height="3" rx="1.5" fill="url(#divider)"/>
    <text x="64" y="348" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#123A2B" fill-opacity="0.78">funnel · pyramid · trend · kpi · gantt — rendered to clean SVG</text>
    <!-- double-framed BY nameplate -->
    <g>
      <rect x="64" y="366" width="150" height="30" fill="none" stroke="#123A2B" stroke-opacity="0.75" stroke-width="1"/>
      <rect x="67.5" y="369.5" width="143" height="23" fill="none" stroke="#123A2B" stroke-opacity="0.45" stroke-width="0.8"/>
      <text x="139" y="386" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="5" fill="#123A2B">BY JQU224</text>
    </g>
  </g>

  <!-- ============ right: line-art of the product (signature components; lifted 10%) ============ -->
  <g stroke-linejoin="round" stroke-linecap="round" transform="translate(0 -42)">
    <!-- mini 3D funnel, 4 layers -->
    <g>
      <path d="M790 118 h208 l-34 52 h-140 Z" fill="#55AE83" stroke="#123A2B" stroke-opacity="0.55"/>
      <ellipse cx="894" cy="118" rx="104" ry="14" fill="#A8D3BC" stroke="#123A2B" stroke-opacity="0.5"/>
      <path d="M824 172 h140 l-30 48 h-80 Z" fill="#D9A24E" stroke="#123A2B" stroke-opacity="0.55"/>
      <path d="M854 222 h80 l-24 46 h-32 Z" fill="#7CBB6E" stroke="#123A2B" stroke-opacity="0.55"/>
      <path d="M878 270 h32 l-16 34 h-4 Z" fill="#46310C" fill-opacity="0.78" stroke="#123A2B" stroke-opacity="0.55"/>
      <path d="M894 310 v26" stroke="#123A2B" stroke-opacity="0.5" stroke-dasharray="3 4"/>
      <path d="M888 336 l6 10 6 -10" fill="none" stroke="#123A2B" stroke-opacity="0.5"/>
    </g>
    <!-- mini KPI card with sparkline -->
    <g>
      <rect x="1022" y="104" width="126" height="96" rx="10" fill="#FFFFFF" fill-opacity="0.85" stroke="#123A2B" stroke-opacity="0.5"/>
      <rect x="1034" y="116" width="30" height="4" rx="2" fill="#D9A24E"/>
      <text x="1034" y="158" font-size="26" font-weight="800" fill="#123A2B">68%</text>
      <polyline points="1034,186 1050,180 1062,183 1078,172 1092,175 1110,164 1130,158" fill="none" stroke="#55AE83" stroke-width="2.5"/>
      <circle cx="1130" cy="158" r="3" fill="#123A2B"/>
    </g>
    <!-- mini 3-tier pyramid -->
    <g>
      <path d="M1085 222 l17 30 h-34 Z" fill="#A8D3BC" stroke="#123A2B" stroke-opacity="0.55"/>
      <path d="M1068 252 h34 l12 28 h-58 Z" fill="#55AE83" stroke="#123A2B" stroke-opacity="0.55"/>
      <path d="M1054 280 h58 l9 28 h-76 Z" fill="#D9A24E" stroke="#123A2B" stroke-opacity="0.55"/>
      <line x1="1044" y1="310" x2="1126" y2="310" stroke="#123A2B" stroke-opacity="0.5" stroke-dasharray="3 4"/>
    </g>
    <!-- mini grouped bars (nudged 20% toward bottom-left to clear the pyramid) -->
    <g transform="translate(-30 24)">
      <line x1="1010" y1="366" x2="1160" y2="366" stroke="#123A2B" stroke-opacity="0.5"/>
      <rect x="1020" y="330" width="16" height="36" rx="2" fill="#55AE83" stroke="#123A2B" stroke-opacity="0.5"/>
      <rect x="1042" y="342" width="16" height="24" rx="2" fill="#D9A24E" stroke="#123A2B" stroke-opacity="0.5"/>
      <rect x="1068" y="318" width="16" height="48" rx="2" fill="#55AE83" stroke="#123A2B" stroke-opacity="0.5"/>
      <rect x="1090" y="336" width="16" height="30" rx="2" fill="#D9A24E" stroke="#123A2B" stroke-opacity="0.5"/>
      <rect x="1116" y="308" width="16" height="58" rx="2" fill="#55AE83" stroke="#123A2B" stroke-opacity="0.5"/>
      <rect x="1138" y="326" width="16" height="40" rx="2" fill="#D9A24E" stroke="#123A2B" stroke-opacity="0.5"/>
    </g>
    <!-- connector: mat leader lines tying art to wordmark block -->
    <g stroke="#123A2B" stroke-opacity="0.28" stroke-dasharray="2 5">
      <line x1="640" y1="140" x2="782" y2="140"/>
      <line x1="640" y1="252" x2="700" y2="252"/>
    </g>
  </g>

  <!-- corner crop marks -->
  <g stroke="#123A2B" stroke-opacity="0.4" stroke-width="1">
    <path d="M8 30 v-14 h14 M1192 30 v-14 h-14 M8 390 v14 h14 M1192 390 v14 h-14" fill="none"/>
  </g>
</svg>
